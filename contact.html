<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Richard Eze</title>
  <meta name="description" content="Get in touch with Richard Eze - Fullstack Developer and Designer">
  <meta name="author" content="Richard Eze">
  
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Navigation -->
  <nav class="navigation" role="navigation">
    <div class="nav-container">
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Profile</a></li>
        <li><a href="contact.html" class="nav-link active" aria-current="page">Contact</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="page-main contact-page">
    <div class="container">
      <header class="page-header">
        <div class="icon-wrapper">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
        </div>
        <h1>Get in Touch</h1>
        <p class="page-description">
          Have a question or want to work together? Fill out the form below and I'll get back to you as soon as
          possible.
        </p>
      </header>

      <div class="form-card">
        <!-- Success Message -->
        <div id="success-message" class="success-message hidden" data-testid="test-contact-success">
          Thank you for your message! We'll get back to you soon.
        </div>

        <form id="contact-form" class="contact-form" novalidate>
          <!-- Full Name -->
          <div class="form-group">
            <label for="name" class="form-label">Full Name *</label>
            <input type="text" id="name" name="name" class="form-input" data-testid="test-contact-name"
              aria-describedby="name-error" required>
            <p id="name-error" class="error-message hidden" data-testid="test-contact-error-name"></p>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email" class="form-label">Email *</label>
            <input type="email" id="email" name="email" class="form-input" data-testid="test-contact-email"
              aria-describedby="email-error" required>
            <p id="email-error" class="error-message hidden" data-testid="test-contact-error-email"></p>
          </div>

          <!-- Subject -->
          <div class="form-group">
            <label for="subject" class="form-label">Subject *</label>
            <input type="text" id="subject" name="subject" class="form-input" data-testid="test-contact-subject"
              aria-describedby="subject-error" required>
            <p id="subject-error" class="error-message hidden" data-testid="test-contact-error-subject"></p>
          </div>

          <!-- Message -->
          <div class="form-group">
            <label for="message" class="form-label">Message *</label>
            <textarea id="message" name="message" rows="6" class="form-input form-textarea"
              data-testid="test-contact-message" aria-describedby="message-error" required></textarea>
            <p id="message-error" class="error-message hidden" data-testid="test-contact-error-message"></p>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-button" data-testid="test-contact-submit">
            Send Message
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
